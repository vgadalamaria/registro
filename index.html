<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A2A4A">
<title>Registro de eventos · Las Ramblas</title>
<meta property="og:title" content="Registro de eventos · Las Ramblas">
<meta property="og:description" content="Regístrate en el evento y recibe tu código para el premio.">
<link rel="icon" type="image/png" href="favicon.png">
<script>
  /* ============ CONFIGURACIÓN (lo único que se cambia) ============
     Pega aquí la URL /exec de la implementación de Apps Script.      */
  var API_URL = https://script.google.com/macros/s/AKfycbx5_-Vob78MHzXVytBjikx9gQKUTgTmJT1PMARinyN7_rbHvS1krKlnLct1gvKCPfx1Qg/exec;
  /* ================================================================ */
</script>
<style>
  @font-face { font-family:'Garet Book'; src:url('garet-book.ttf') format('truetype'); font-display:swap; }
  :root { --navy:#1A2A4A; --terra:#9C5B3C; --sand:#F7EFE8; --ink:#1F2430; --mute:#6B7280; --line:#D9DDE3; }
  * { box-sizing:border-box; }
  button, input, select { font-family:inherit; }
  body { margin:0; font-family:'Garet Book',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--sand); color:var(--ink); -webkit-text-size-adjust:100%; }
  .marca { background:#fff; padding:16px 20px 14px; text-align:center; border-bottom:1px solid var(--line); }
  .marca img { width:190px; max-width:60%; height:auto; display:inline-block; }
  header { background:var(--navy); color:#fff; padding:20px 20px 26px; }
  header .k { font-size:11px; letter-spacing:3px; opacity:.7; text-transform:uppercase; }
  header h1 { margin:8px 0 4px; font-size:23px; line-height:1.2; font-weight:700; }
  header .sub { font-size:13px; opacity:.85; }
  .premio { margin:-14px 16px 0; background:var(--terra); color:#fff; border-radius:12px; padding:12px 14px; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  main { padding:18px 16px 30px; max-width:520px; margin:0 auto; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; color:var(--navy); }
  input[type=text], input[type=tel], input[type=email], select { width:100%; padding:13px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .op { display:flex; flex-wrap:wrap; gap:8px; }
  .op button { flex:1 1 auto; padding:11px 12px; font-size:14px; border:1px solid var(--line); border-radius:22px; background:#fff; color:var(--ink); }
  .op button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .chk { display:flex; gap:10px; align-items:flex-start; font-size:13px; margin-top:14px; line-height:1.4; }
  .chk input { width:22px; height:22px; margin:0; flex:none; }
  .enviar { width:100%; margin-top:22px; padding:16px; font-size:17px; font-weight:700; border:0; border-radius:12px; background:var(--terra); color:#fff; }
  .enviar:disabled { opacity:.6; }
  .err { color:#B04A3A; font-size:14px; margin-top:12px; min-height:18px; }
  .nota { font-size:11.5px; color:var(--mute); margin-top:6px; }
  .hp { position:absolute; left:-5000px; width:1px; height:1px; overflow:hidden; }
  .ok { text-align:center; padding:26px 18px; }
  .ok h2 { color:var(--navy); margin:6px 0; font-size:24px; }
  .codigo { font-size:52px; font-weight:800; letter-spacing:10px; color:var(--navy); background:#fff; border:2px dashed var(--terra); border-radius:16px; padding:18px 10px; margin:18px auto; max-width:300px; }
  .cerrado { padding:36px 20px; text-align:center; color:var(--mute); line-height:1.5; }
  .cerrado button { margin-top:16px; padding:12px 22px; border:0; border-radius:10px; background:var(--navy); color:#fff; font-size:15px; }
  .cargando { padding:40px 0; text-align:center; color:var(--mute); }
  footer { text-align:center; font-size:11px; color:var(--mute); padding:0 16px 28px; }
</style>
</head>
<body>
<div class="marca"><img src="logo-lasramblas.png" alt="Las Ramblas"></div>
<header>
  <div class="k">Registro de evento</div>
  <h1 id="tEvento">Cargando…</h1>
  <div class="sub" id="tSub"></div>
</header>
<div class="premio" id="tPremio" style="display:none"></div>
<main id="app"><div class="cargando">Cargando el evento…</div></main>
<footer>Las Ramblas · Grupo Palmetto</footer>
<script>
(function(){
  var EV = (new URLSearchParams(location.search).get('ev') || '').trim();
  var st = { sexo:'', carro:'', como:'' };
  var enviando = false;

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function aviso(t, reintentar){
    el('app').innerHTML = '<div class="cerrado">' + t + (reintentar ? '<br><button type="button" id="re">Intentar de nuevo</button>' : '') + '</div>';
    if (reintentar) el('re').addEventListener('click', function(){ location.reload(); });
  }

  /* Llamada a Apps Script con tiempo límite y reintentos.
     GET para leer el evento; POST con texto plano para registrar
     (texto plano evita la verificación previa CORS que Apps Script no admite). */
  function llamar(opciones, intentos){
    intentos = intentos || 3;
    var espera = 800;
    function uno(n){
      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var t = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 15000);
      var url = API_URL + (opciones.query ? '?' + opciones.query : '');
      var init = { method: opciones.body ? 'POST' : 'GET', redirect:'follow', signal: ctrl ? ctrl.signal : undefined };
      if (opciones.body) { init.headers = { 'Content-Type':'text/plain;charset=utf-8' }; init.body = JSON.stringify(opciones.body); }
      return fetch(url, init).then(function(r){
        clearTimeout(t);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).catch(function(e){
        clearTimeout(t);
        if (n + 1 >= intentos) throw e;
        return new Promise(function(res){ setTimeout(res, espera * Math.pow(2, n)); }).then(function(){ return uno(n + 1); });
      });
    }
    return uno(0);
  }

  function opts(name, vals){ return '<div class="op" data-n="'+name+'">' + vals.map(function(v){ return '<button type="button" data-v="'+esc(v)+'">'+esc(v)+'</button>'; }).join('') + '</div>'; }

  function form(){
    el('app').innerHTML =
      '<label for="nombre">Nombre completo</label><input type="text" id="nombre" autocomplete="name" maxlength="80" placeholder="Ej. Ana López">' +
      '<label for="celular">Celular</label><input type="tel" id="celular" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="7000 0000">' +
      '<label for="correo">Correo <span style="font-weight:400;color:var(--mute)">(opcional)</span></label><input type="email" id="correo" autocomplete="email" maxlength="100" placeholder="tu@correo.com">' +
      '<label for="edad">Edad</label><select id="edad"><option value="">Elige…</option><option>Menos de 18</option><option>18 a 24</option><option>25 a 34</option><option>35 a 44</option><option>45 a 54</option><option>55 o más</option></select>' +
      '<label>Sexo</label>' + opts('sexo', ['Mujer','Hombre','Prefiero no decir']) +
      '<label for="municipio">¿En qué municipio vives?</label><input type="text" id="municipio" list="munis" maxlength="60" placeholder="Ej. Santa Tecla"><datalist id="munis"><option>Santa Tecla</option><option>San Salvador</option><option>Antiguo Cuscatlán</option><option>Nuevo Cuscatlán</option><option>Colón</option><option>Zaragoza</option><option>Soyapango</option><option>Mejicanos</option><option>Santa Ana</option><option>San Miguel</option><option>San Luis Talpa</option><option>Usulután</option></datalist>' +
      '<label>¿Cómo te enteraste del evento?</label>' + opts('como', ['Instagram','Facebook','TikTok','Pasaba por aquí','Amigos o familia','Un comercio del centro','Otro']) +
      '<label>¿Viniste en carro?</label>' + opts('carro', ['Sí','No']) +
      '<div class="hp" aria-hidden="true"><label for="web">No llenar</label><input type="text" id="web" tabindex="-1" autocomplete="off"></div>' +
      '<div class="chk"><input type="checkbox" id="privacidad"><label for="privacidad" style="margin:0;font-weight:400;color:inherit;font-size:13px">Acepto que Grupo Palmetto use estos datos para medir y mejorar sus eventos. No los compartimos con terceros.</label></div>' +
      '<div class="chk"><input type="checkbox" id="promos"><label for="promos" style="margin:0;font-weight:400;color:inherit;font-size:13px">Quiero recibir invitaciones a próximos eventos y promociones de Las Ramblas.</label></div>' +
      '<div class="err" id="err" role="alert"></div>' +
      '<button class="enviar" id="btn" type="button">Registrarme</button>' +
      '<div class="nota">Al registrarte recibes un código para reclamar tu premio. Un registro por persona.</div>';
    Array.prototype.forEach.call(document.querySelectorAll('.op'), function(g){
      g.addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(!b) return;
        Array.prototype.forEach.call(g.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
        b.classList.add('on'); st[g.getAttribute('data-n')] = b.getAttribute('data-v'); });
    });
    el('btn').addEventListener('click', enviar);
  }

  function error(t){ el('err').textContent = t; }
  function boton(activo){ el('btn').disabled = !activo; el('btn').textContent = activo ? 'Registrarme' : 'Registrando…'; }

  function enviar(){
    if (enviando) return;
    var f = { ev:EV, nombre:el('nombre').value.trim(), celular:el('celular').value, correo:el('correo').value.trim(), edad:el('edad').value,
      sexo:st.sexo, municipio:el('municipio').value.trim(), como:st.como, carro:st.carro,
      privacidad:el('privacidad').checked, promos:el('promos').checked, web:el('web').value };
    if (!f.nombre) return error('Escribe tu nombre.');
    if (f.celular.replace(/\D/g,'').length < 8) return error('Escribe un celular de 8 dígitos.');
    if (f.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.correo)) return error('Revisa tu correo, o déjalo en blanco.');
    if (f.edad === 'Menos de 18') return error('Para menores de 18, el registro lo hace su mamá, papá o encargado.');
    if (!f.privacidad) return error('Para registrarte debes aceptar el aviso de privacidad.');
    enviando = true; boton(false); error('');
    /* Reintentar es seguro: el servidor reconoce el celular y devuelve el mismo código. */
    llamar({ body:{ accion:'registrar', datos:f } }, 3).then(function(r){
      enviando = false;
      if (!r || !r.ok) { boton(true); return error((r && r.error) || 'No se pudo registrar. Intenta de nuevo.'); }
      listo(r);
    }).catch(function(){
      enviando = false; boton(true);
      error(navigator.onLine === false ? 'Parece que no tienes conexión. Revisa tu internet e intenta de nuevo.' : 'No pudimos conectar. Espera unos segundos e intenta de nuevo.');
    });
  }

  function listo(r){
    el('app').innerHTML = '<div class="ok"><div style="font-size:44px;color:var(--terra)">✓</div><h2>' + (r.repetido ? '¡Ya estabas registrado!' : '¡Listo, ya estás registrado!') + '</h2>' +
      '<div>Tu código para el premio es:</div><div class="codigo">' + esc(r.codigo) + '</div>' +
      '<div style="font-size:14px">Muéstralo en el stand de Las Ramblas' + (r.premio ? ' para recibir: <b>' + esc(r.premio) + '</b>' : '') + '.</div>' +
      '<div class="nota" style="margin-top:16px">Tómale captura de pantalla a este código.</div></div>';
    window.scrollTo(0, 0);
  }

  if (!EV) { el('tEvento').textContent = 'Registro de eventos'; return aviso('Escanea el código QR del evento para registrarte.'); }
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)) { el('tEvento').textContent = 'Registro de eventos'; return aviso('Esta página aún no está configurada.'); }

  llamar({ query:'api=info&ev=' + encodeURIComponent(EV) }, 3).then(function(r){
    var e = r && r.ok ? r.evento : null;
    if (!e) { el('tEvento').textContent = 'Evento no encontrado'; return aviso('Este código QR no corresponde a un evento activo.'); }
    el('tEvento').textContent = e.nombre; el('tSub').textContent = [e.centro, e.fecha].filter(Boolean).join(' · ');
    document.title = e.nombre + ' · Las Ramblas';
    if (e.premio) { el('tPremio').style.display = 'block'; el('tPremio').innerHTML = '🎁 Regístrate y recibe: <b>' + esc(e.premio) + '</b>'; }
    if (!e.activo) return aviso('El registro de este evento ya cerró. ¡Gracias por venir!');
    form();
  }).catch(function(){
    el('tEvento').textContent = 'Registro de eventos';
    aviso('No pudimos cargar el evento. Revisa tu conexión.', true);
  });
})();
</script>
</body>
</html>
